name: featurehub_client_sdk
version: 1.4.0
description: Dart SDK implementation for FeatureHub - open source Feature Flag management, A/B testing and remote configuration platform. Suitable for Flutter Web, Mobile and Desktop.
repository: https://github.com/featurehub-io/featurehub-flutter-sdk/tree/main/featurehub-client-sdk
homepage: https://www.featurehub.io
# consumed from this repo (git/path), not pub.dev: the published
# featurehub_client_api 1.4.0 pins dio ^4 which conflicts with dio ^5.
publish_to: none
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'
dependencies:
  # NOTE: shared_preferences makes this package Flutter-only. The pure-Dart
  # example_dart_cli/ and example_server/ projects no longer resolve, and the
  # test suite must be run with `flutter test` rather than `dart test`.
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  dio: ^5.0.0
  crypto: ^3.0.2
  featurehub_sse_client:
    path: ../featurehub-sse-client
  collection: ^1.15.0
  logging: ^1.0.1
  rxdart: '>=0.27.2 <0.29.0'
  featurehub_client_api:
    path: ../featurehub-client-api
  openapi_dart_common: ^5.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
#  test_coverage: ^0.4.2
  mocktail: ^1.0.0
  lints: ^5.0.0
